services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claimback
      POSTGRES_PASSWORD: claimback
      POSTGRES_DB: claimback
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimback"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    profiles:
      - app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://claimback:claimback@db:5432/claimback
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
